name: Extract OPLUS Subsystems

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract-oplus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Xen-OOS
        uses: actions/checkout@v4
        with:
          ref: Xen-OOS
          fetch-depth: 1

      - name: Verify and package OPLUS directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/drivers/oplus
          subsystems=(frame_boost midas vnet devinfo project process_reclaim force_shutdown storage bootprof dump_reason sched_info binder_strategy shutdown_detect)
          for name in "${subsystems[@]}"; do
            src="drivers/oplus/$name"
            if [[ ! -d "$src" ]]; then
              echo "::error::Directory missing: $src"
              exit 1
            fi
            cp -a "$src" package/drivers/oplus/
          done
          [[ -f drivers/oplus/Kconfig ]] && cp drivers/oplus/Kconfig package/drivers/oplus/
          [[ -f drivers/oplus/Makefile ]] && cp drivers/oplus/Makefile package/drivers/oplus/
          printf '%s\n' "Extracted 13 OPLUS directories from Xen-OOS." > package/MANIFEST.txt
          zip -qr OPLUS-13-Subsystems-Xen-OOS.zip package

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OPLUS-13-Subsystems-Xen-OOS
          path: OPLUS-13-Subsystems-Xen-OOS.zip
          if-no-files-found: error
          retention-days: 30
